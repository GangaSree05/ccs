<h1>CSRF Vulnerability Demo</h1>
 
<h2>Malicious CSRF Attack (Auto Submit)</h2>
<p>This simulates an attacker triggering a fund transfer.</p>

<form id="attackForm" action="http://localhost:8080/transfer" method="POST">
    <input type="hidden" name="toAccount" value="9999999999">
    <input type="hidden" name="amount" value="5000">
</form>

<button onclick="document.getElementById('attackForm').submit()">
    Launch CSRF Attack
</button>

<hr> 
<h2>Secure Fund Transfer (With CSRF Token)</h2>
<p>This form includes CSRF protection.</p>

<form action="http://localhost:8080/secure-transfer" method="POST">
    <label>To Account:</label>
    <input type="text" name="toAccount" required><br><br>

    <label>Amount:</label>
    <input type="text" name="amount" required><br><br>

    <!-- CSRF Token (generated by server) -->
    <input type="hidden" name="csrfToken" value="ABC123XYZ">

    <button type="submit">Secure Transfer</button>
</form>
